<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gander International Airport</title>
    <link rel="stylesheet" href="css/terminal.css" />
  </head>
  <body data-theme="green" data-crt="on" data-presentation="false">
    <!--
      No flight information lives in this file. The board is built at runtime
      from data/flights.js (history) and data/display-states.js (presentation).
    -->
    <div id="bezel">
      <div id="screen"><div id="board"></div></div>
      <div class="overlay scanlines"></div>
      <div class="overlay scanbar"></div>
      <div class="overlay vignette"></div>
      <div class="overlay flicker"></div>
    </div>

    <div id="devbar"></div>

    <script src="data/flights.js"></script>
    <script src="data/arrival-simulation.js"></script>
    <script src="data/display-states.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/states.js"></script>
    <script src="js/fids.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
